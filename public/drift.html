<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drift: a one-button calm game</title>
<style>
  :root { color-scheme: light dark; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #FCFCFA;
    color: #1C1B1A;
    font-family: -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html[data-theme="dark"], html[data-theme="dark"] body { background: #1A1815; color: #ECE7DD; }
  /* Standalone page chrome — a minimal, intentional frame around the game. */
  .page {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-sizing: border-box; padding: 24px 18px 40px;
    gap: 18px;
  }
  .masthead { text-align: center; user-select: none; }
  .masthead h1 {
    margin: 0; font-family: Georgia, 'Times New Roman', serif;
    font-weight: 600; font-size: clamp(28px, 5vw, 44px); letter-spacing: 0.01em;
    color: #1C1B1A;
  }
  html[data-theme="dark"] .masthead h1 { color: #ECE7DD; }
  .masthead p {
    margin: 6px 0 0; font-size: 14px; color: #8b867f; font-weight: 400;
  }
  html[data-theme="dark"] .masthead p { color: #B6AFA2; }
  #drift-game {
    width: min(880px, 100%);
    aspect-ratio: 16 / 9;
    max-height: 70vh;
  }
  @media (max-aspect-ratio: 1/1) {
    #drift-game { aspect-ratio: 4 / 3; }
  }
  .footnote {
    font-size: 12px; color: #8b867f; text-align: center; max-width: 40ch; line-height: 1.5;
  }
  html[data-theme="dark"] .footnote { color: #B6AFA2; }
  .theme-toggle {
    position: fixed; top: 16px; right: 16px;
    background: transparent; border: 1px solid #ece7df; color: #56524d;
    border-radius: 999px; padding: 7px 14px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: border-color .3s, color .3s;
  }
  html[data-theme="dark"] .theme-toggle { border-color: #2E2B25; color: #B6AFA2; }
  .theme-toggle:hover { border-color: #2f6fae; color: #2f6fae; }
  html[data-theme="dark"] .theme-toggle:hover { border-color: #84B6E6; color: #84B6E6; }
</style>
</head>
<body>
  <!-- Theme bootstrap: mirror the site's convention (localStorage "ts_theme"). -->
  <script>try{var t=localStorage.getItem("ts_theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle day or night theme">night</button>

  <div class="page">
    <div class="masthead">
      <h1>Drift</h1>
      <p>One button. Let the thoughts pass beneath you.</p>
    </div>

    <!-- The game mounts itself here. -->
    <div id="drift-game"></div>

    <p class="footnote">Tap, click, or press space to hop. A small, kind game about staying steady.</p>
  </div>

  <script>
    // Standalone-only theme toggle (the embedded site has its own).
    (function(){
      var btn = document.getElementById('themeToggle');
      if(!btn) return;
      function sync(){
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        btn.textContent = dark ? 'day' : 'night';
      }
      sync();
      btn.addEventListener('click', function(){
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        var next = dark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('ts_theme', next); } catch(e){}
        sync();
      });
    })();
  </script>

<script src="/assets/drift.js"></script>
</body>
</html>

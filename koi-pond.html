<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Lanterns: idle here while you read</title>
<!-- standalone demo: follow the OS light/dark setting so the page and the pond match.
     (When embedded on the site, the site sets data-theme and the pond follows it.) -->
<script>try{document.documentElement.setAttribute('data-theme',(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');}catch(e){}</script>
<style>
  :root{
    --paper:#FCFCFA; --ink:#1C1B1A; --soft-ink:#56524d; --faint:#8b867f; --hairline:#ece7df;
  }
  html[data-theme="dark"]{
    --paper:#1A1815; --ink:#ECE7DD; --soft-ink:#B6AFA2; --faint:#7d776c; --hairline:#2E2B25;
  }
  html,body{margin:0;height:100%;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system, system-ui, sans-serif;
    transition:background .6s ease, color .6s ease;
    overflow-x:hidden;
  }
  /* full-viewport fixed pond behind everything */
  #koi-pond{position:fixed; inset:0; z-index:0; pointer-events:none;}
  .page{position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:8vh 24px;}
  .card{max-width:520px; text-align:center;}
  .eyebrow{font-family:ui-monospace,'JetBrains Mono',Menlo,monospace; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint); margin:0 0 14px;}
  h1.title{font-family:'Fraunces',Georgia,'Times New Roman',serif; font-weight:500; font-size:clamp(30px,6vw,46px); line-height:1.1; margin:0 0 18px; letter-spacing:-.01em;}
  p.sub{font-size:16px; line-height:1.7; color:var(--soft-ink); margin:0 auto; max-width:40ch;}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  .sr-only:focus{position:fixed!important;left:16px;top:16px;width:auto;height:auto;clip:auto;padding:10px 14px;background:var(--ink);color:var(--paper);border-radius:8px;z-index:9;}
</style>
</head>
<body>

<div id="koi-pond" data-keepout-width="600"></div>

<main class="page">
  <div class="card">
    <p class="eyebrow">the toolshed</p>
    <h1 class="title">idle here while you read</h1>
    <p class="sub">A quiet pond of floating paper lanterns. Move your cursor and they drift toward you; tap and the nearest one drifts away. Sit still for a while and the water calms, and their glow blooms into a slow, soft composition that is different every visit.</p>
  </div>
</main>

<script src="/assets/koi-pond.js"></script>
</body>
</html>
